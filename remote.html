<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111214" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VerseObs" />
    <title>Télécommande · VerseObs</title>
    <link rel="icon" href="assets/icons/radio.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/remote.css?v=2.93" />
  </head>
  <body data-link="connecting">
    <main class="remote" aria-labelledby="session-name">
      <p class="output" id="output" data-state="unknown" aria-live="polite">
        <span class="output-tag"
          ><span class="output-fill" aria-hidden="true"></span
          ><span class="output-dot" aria-hidden="true"></span>Antenne</span
        ><span class="output-label" id="output-label">État de la sortie inconnu</span
        ><span class="output-ref" id="output-ref"></span>
      </p>
      <header class="remote-top">
        <div class="remote-brand">
          <img
            class="icon"
            src="assets/icons/radio.svg"
            alt=""
            width="16"
            height="16"
          />VerseObs <span>Télécommande</span>
        </div>
        <h1 id="session-name">Connexion au Studio…</h1>
        <span class="link-pill" id="link-pill" role="status" aria-live="polite"
          >Connexion…</span
        >
      </header>

      <p class="banner" id="banner" role="alert" hidden></p>

      <button class="bible-button" id="btn-bible" type="button" disabled>Choisir un verset</button>

      <section class="slot slot-current" aria-labelledby="current-title">
        <div class="slot-head">
          <h2 id="current-title">Sélection</h2>
          <span class="slot-plan" id="current-plan" hidden></span>
          <span class="slot-live" id="current-live" hidden>À l’antenne</span>
          <span class="slot-position" id="position"></span>
        </div>
        <p class="slot-ref" id="current-ref">—</p>
        <p class="slot-text" id="current-text"></p>
      </section>
      <section class="slot slot-next" aria-labelledby="next-title">
        <div class="slot-head"><h2 id="next-title">Ensuite</h2></div>
        <p class="slot-ref" id="next-ref">—</p>
        <p class="slot-text" id="next-text"></p>
      </section>

    </main>
    <footer class="thumb">
      <nav class="controls" aria-label="Commandes du conducteur">
        <button class="control control-nav" id="btn-prev" data-command="prev" type="button" disabled>
          <img class="icon" src="assets/icons/chevron-left.svg" alt="" width="22" height="22" />
          <span>Précédent</span>
        </button>
        <button class="control control-nav" id="btn-next" data-command="next" type="button" disabled>
          <span>Suivant</span>
          <img class="icon" src="assets/icons/chevron-right.svg" alt="" width="22" height="22" />
        </button>
        <button class="control control-show" id="btn-show" data-command="show" type="button" disabled>
          <img class="icon" src="assets/icons/play.svg" alt="" width="20" height="20" />
          <span>Diffuser la sélection</span>
        </button>
      </nav>
      <button class="control control-hide" id="btn-hide" data-command="hide" type="button">
        <img class="icon" src="assets/icons/eye-off.svg" alt="" width="20" height="20" />
        <span>Masquer</span>
      </button>
    </footer>
    <dialog id="bible-dialog" class="bible-dialog" aria-labelledby="bible-title">
      <header class="bible-heading">
        <div><h2 id="bible-title">Choisir un verset</h2><p id="bible-version">Bible indisponible</p></div>
        <button id="bible-close" class="bible-button" type="button">Fermer</button>
      </header>
      <div class="bible-scroll">
      <form id="bible-form">
        <fieldset id="bible-fields" disabled>
          <label for="bible-query">Livre ou référence complète</label>
          <input id="bible-query" type="search" placeholder="Jn, 1 Co, Jean 3:16-18" maxlength="100" autocomplete="off" enterkeyhint="search" />
          <label for="bible-book">Livre</label>
          <select id="bible-book"></select>
          <div class="bible-numbers">
            <div><label for="bible-chapter">Chapitre</label><select id="bible-chapter"></select></div>
            <div><label for="bible-verses">Verset ou plage</label><input id="bible-verses" type="text" placeholder="16-18" value="1" maxlength="9" autocomplete="off" enterkeyhint="go" /></div>
          </div>
        </fieldset>
        <button class="bible-button" id="bible-read" type="submit" disabled>Lire le passage</button>
      </form>
      <p id="bible-status" role="status" aria-live="polite"></p>
      <section id="bible-preview" hidden aria-labelledby="bible-ref">
        <h3 id="bible-ref"></h3><p id="bible-text"></p>
      </section>
      </div>
      <div class="bible-send-zone">
        <button class="bible-button" id="bible-send" type="button" disabled>Envoyer dans l’aperçu régie</button>
        <p>Jamais à l’antenne automatiquement. Diffusion depuis la régie.</p>
      </div>
    </dialog>
    <script src="assets/js/shared/books.js?v=2.93"></script>
    <script src="assets/js/shared/remote-bible.js?v=2.93"></script>
    <script src="assets/js/remote/bible-picker.js?v=2.93"></script>
    <script src="assets/js/remote/remote.js?v=2.93"></script>
  </body>
</html>
