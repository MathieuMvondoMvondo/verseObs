<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0e10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Live English subtitles · VerseObs</title>
    <link rel="icon" href="assets/icons/radio.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/sous-titres.css?v=1" />
  </head>
  <body data-link="connecting" data-live="0">
    <header class="st-top">
      <div class="st-heading">
        <h1 class="st-title">Live English subtitles</h1>
        <p class="st-status" id="st-status" role="status">Connecting…</p>
      </div>
      <div class="st-size" role="group" aria-label="Text size">
        <button type="button" id="st-smaller" aria-label="Smaller text">A−</button>
        <button type="button" id="st-larger" aria-label="Larger text">A+</button>
      </div>
    </header>
    <main class="st-feed" id="st-feed" lang="en" aria-live="polite">
      <p class="st-empty" id="st-empty">
        The English translation of the sermon will appear here.
      </p>
    </main>
    <button type="button" class="st-back" id="st-back" hidden>
      Back to live
    </button>
    <footer class="st-note" id="st-note">
      Automatic translation of the French sermon: some sentences may be wrong
      or misleading.
    </footer>
    <script src="assets/js/sous-titres/sous-titres.js?v=1"></script>
  </body>
</html>
